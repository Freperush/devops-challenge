name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Lint
        run: pip install ruff && ruff check app scripts
      - name: Docker build
        run: docker build -t devops-api:${{ github.sha }} .

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest --cov=app --cov-branch --cov-fail-under=90 --cov-report=xml --cov-report=term-missing
