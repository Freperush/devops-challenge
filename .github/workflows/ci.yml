name: ci

on:
  pull_request:
  push:
    branches-ignore:
      - master
  workflow_call:

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Lint
        run: pip install ruff && ruff check app scripts
      - name: Docker build
        run: docker build -t devops-api:${{ github.sha }} .

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: JWT generator on Python 3.9
        env:
          JWT_SECRET: test-secret-test-secret-test-sec
        run: python scripts/generate_jwt.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest --cov=app --cov-branch --cov-fail-under=90 --cov-report=xml --cov-report=html --cov-report=term-missing
      - name: Publish coverage summary
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
