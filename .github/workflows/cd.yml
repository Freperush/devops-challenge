name: cd

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target namespace
        type: choice
        options: [dev, staging, prod]
        default: prod
      version:
        description: Existing image tag, for example sha-abcdef or v1.0.0
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  Deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image
        id: image
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="sha-${GITHUB_SHA}"
            az acr login --name "${{ secrets.ACR_NAME }}"
            docker build -t "${{ secrets.ACR_NAME }}.azurecr.io/devops-api:${TAG}" .
            docker push "${{ secrets.ACR_NAME }}.azurecr.io/devops-api:${TAG}"
          fi
          az acr repository show --name "${{ secrets.ACR_NAME }}" --image "devops-api:${TAG}" >/dev/null
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-kubectl@v4
      - name: Deploy
        run: |
          set -euo pipefail
          ENV="${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}"
          az aks get-credentials --resource-group "${{ secrets.AKS_RESOURCE_GROUP }}" --name "${{ secrets.AKS_CLUSTER_NAME }}" --overwrite-existing
          kubectl create namespace "$ENV" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$ENV" create secret generic devops-api \
            --from-literal=API_KEY="${{ secrets.API_KEY }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          IMAGE="${{ secrets.ACR_NAME }}.azurecr.io/devops-api:${{ steps.image.outputs.tag }}"
          kubectl kustomize "deploy/k8s/overlays/${ENV}" | sed "s#devops-api:local#${IMAGE}#" | kubectl apply -f -
          kubectl apply -k deploy/k8s/gateway
          case "$ENV" in
            prod) API_ID="devops" ;;
            dev) API_ID="devops-dev" ;;
            staging) API_ID="devops-staging" ;;
            *) echo "Unknown environment: $ENV"; exit 1 ;;
          esac
          IP=""
          for _ in $(seq 1 36); do
            IP="$(kubectl -n gateway get svc edge -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
            if [ -n "$IP" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$IP" ]; then
            echo "The shared gateway did not receive an IP"
            exit 1
          fi
          az apim api update \
            --resource-group "${{ secrets.AKS_RESOURCE_GROUP }}" \
            --service-name "${{ secrets.APIM_NAME }}" \
            --api-id "$API_ID" \
            --service-url "http://${IP}"
          echo "API ${API_ID} now targets the ${ENV} namespace"
          echo "Deployed ${IMAGE} to ${ENV}"
