name: cd

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target namespace
        type: choice
        options: [dev, staging, prod]
        default: prod
      version:
        description: Existing image tag, for example sha-abcdef or v1.0.0
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  Deploy:
    needs: ci
    if: ${{ !failure() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.environment != 'prod' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
    env:
      API_KEY: ${{ secrets.API_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
      APIM_NAME: ${{ secrets.APIM_NAME }}
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image
        id: image
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$REQUESTED_VERSION"
            case "$TAG" in
              sha-*|v[0-9]*) ;;
              *) echo "Invalid version tag: $TAG"; exit 1 ;;
            esac
          else
            TAG="sha-${GITHUB_SHA}"
            az acr login --name "$ACR_NAME"
            docker build -t "${ACR_NAME}.azurecr.io/devops-api:${TAG}" .
            docker push "${ACR_NAME}.azurecr.io/devops-api:${TAG}"
          fi
          az acr repository show --name "$ACR_NAME" --image "devops-api:${TAG}" >/dev/null
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-kubectl@v5
      - name: Deploy
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="$REQUESTED_ENVIRONMENT"
          else
            ENV="prod"
          fi
          case "$ENV" in
            prod) API_ID="devops"; URL_PATH="/DevOps" ;;
            dev) API_ID="devops-dev"; URL_PATH="/dev/DevOps" ;;
            staging) API_ID="devops-staging"; URL_PATH="/staging/DevOps" ;;
            *) echo "Unknown environment: $ENV"; exit 1 ;;
          esac
          az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --overwrite-existing
          kubectl create namespace "$ENV" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$ENV" create secret generic devops-api \
            --from-literal=API_KEY="$API_KEY" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -
          IMAGE="${ACR_NAME}.azurecr.io/devops-api:${{ steps.image.outputs.tag }}"
          kubectl kustomize "deploy/k8s/overlays/${ENV}" | sed "s#devops-api:local#${IMAGE}#" | kubectl apply -f -
          kubectl apply -k deploy/k8s/gateway
          kubectl -n "$ENV" rollout status deployment/devops-api --timeout=180s
          kubectl -n gateway rollout status deployment/edge --timeout=180s
          IP=""
          for _ in $(seq 1 36); do
            IP="$(kubectl -n gateway get svc edge -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
            if [ -n "$IP" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$IP" ]; then
            echo "The shared gateway did not receive an IP"
            exit 1
          fi
          az apim api update \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --service-name "$APIM_NAME" \
            --api-id "$API_ID" \
            --service-url "http://${IP}"
          JWT="$(python3 scripts/generate_jwt.py)"
          EXPECTED='{"message": "Hello Juan Perez your message will be sent"}'
          POST_BODY="$(curl --fail-with-body -sS -X POST \
            -H "X-Parse-REST-API-Key: ${API_KEY}" \
            -H "X-JWT-KWY: ${JWT}" \
            -H "Content-Type: application/json" \
            -d '{ "message": "This is a test", "to": "Juan Perez", "from": "Rita Asturia", "timeToLifeSec": 45 }' \
            "https://${APIM_NAME}.azure-api.net${URL_PATH}")"
          echo "$POST_BODY"
          test "$POST_BODY" = "$EXPECTED"
          GET_CODE="$(curl -sS -o /tmp/get-body.txt -w "%{http_code}" "https://${APIM_NAME}.azure-api.net${URL_PATH}")"
          echo "GET ${GET_CODE} $(cat /tmp/get-body.txt)"
          test "$GET_CODE" = "405"
          grep -q "ERROR" /tmp/get-body.txt
          echo "Deployed ${IMAGE} to ${ENV}"
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
