worker_processes 1;
error_log /tmp/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;

    location = /DevOps {
      proxy_pass http://devops-api.prod.svc.cluster.local:80;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location = /dev/DevOps {
      proxy_pass http://devops-api.dev.svc.cluster.local:80/DevOps;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location = /staging/DevOps {
      proxy_pass http://devops-api.staging.svc.cluster.local:80/DevOps;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
