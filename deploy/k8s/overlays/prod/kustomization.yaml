apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - namespace.yaml
  - ../../base
  - hpa.yaml
  - pdb.yaml
patches:
  - target:
      kind: Deployment
      name: devops-api
    patch: |-
      - op: remove
        path: /spec/replicas
  - target:
      kind: Service
      name: devops-api
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
